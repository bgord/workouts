<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Workouts" />

    <link rel="preload" as="style" href="/public/main.min.css" />
    <link rel="stylesheet" href="/public/main.min.css" />
    <link rel="preload" as="style" href="/public/custom.css" />
    <link rel="stylesheet" href="/public/custom.css" />

    <title>Workouts</title>
  </head>

  <body data-mx="auto">
    <header data-bcb="alpha-subtle" data-bsb="solid" data-bwb="hairline">
      <div
        data-cross="center"
        data-disp="flex"
        data-height="100%"
        data-maxw="md"
        data-mx="auto"
        data-px="3"
        data-width="100%"
        style="height: 70px"
      >
        <div
          class="logo"
          data-color="brand-500"
          data-cross="center"
          data-disp="flex"
          data-fs="2xl"
          data-fw="bold"
          data-gap="2"
          data-lh="none"
          data-ls="wider"
          data-transform="uppercase"
        >
          <a href="/">Workouts</a>
        </div>
      </div>
    </header>

    <main data-maxw="md" data-mx="auto" data-pb="16" data-pt="12" data-px="3" data-stack="y" data-width="100%">
      <form
        id="register"
        class="c-card"
        action="/api/auth/sign-up/email"
        method="post"
        data-gap="5"
        data-mx="auto"
        data-status="initial"
        data-width="100%"
        style="max-width: 400px"
      >
        <h1 data-color="neutral-0" data-fs="2xl" data-fw="black" data-md-fs="xl">Register</h1>

        <div data-gap="4" data-stack="y">
          <div data-stack="y">
            <label class="c-label" for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              class="c-input"
              autofocus
              required
              placeholder="user@example.com"
              inputmode="email"
              autocomplete="email"
              autocapitalize="none"
              spellcheck="false"
              enterkeyhint="next"
            />
          </div>

          <div data-stack="y">
            <label class="c-label" for="password">Password</label>
            <input
              id="password"
              name="password"
              class="c-input"
              type="password"
              required
              placeholder="*********"
              autocomplete="new-password"
              enterkeyhint="send"
            />
          </div>
        </div>

        <div data-gap="3" data-stack="y">
          <button data-when="initial error" class="c-button" data-variant="primary" type="submit">
            Register
          </button>
          <button data-when="pending" class="c-button" data-variant="primary" type="submit" disabled>
            Registering...
          </button>

          <output
            data-when="error"
            aria-live="assertive"
            data-bg="danger-900"
            data-br="md"
            data-color="danger-100"
            data-fs="sm"
            data-p="3"
          >
            Something went wrong
          </output>

          <output
            data-when="success"
            aria-live="polite"
            data-bg="positive-900"
            data-br="md"
            data-color="positive-100"
            data-fs="sm"
            data-p="3"
          >
            Check your inbox
          </output>
        </div>

        <div class="c-card-footer" data-fs="sm" data-gap="2" data-main="center">
          <span data-color="neutral-400">Already have an account?</span>
          <a class="c-link" href="/public/login.html">Login</a>
        </div>
      </form>
    </main>

    <script>
      const form = document.querySelector("#register");
      form.dataset.status = "initial";

      form.addEventListener("submit", async (event) => {
        event.preventDefault();

        if (form.dataset.status === "pending") return;
        if (!form.reportValidity()) return;

        form.dataset.status = "pending";

        try {
          const data = new FormData(form);
          data.append("name", data.get("email"));

          const response = await fetch(form.action, {
            method: form.method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(data)),
            credentials: "include",
          });

          form.dataset.status = response.ok ? "success" : "error";

          form.reset();
        } catch {
          form.dataset.status = "error";
        }
      });
    </script>
  </body>
</html>
